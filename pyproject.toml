[project]
name = "doc-reconciler"
version = "0.1.0"
description = "Deterministic document reconciliation using Pydantic, Streamlit, and pdf-inspector"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
    "pdf-inspector>=1.21.0",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "ollama>=0.6.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
